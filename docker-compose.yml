# Local development stack. Ports bind to localhost only (DEPLOYMENT.md).
# Redis is added with PHASE-08. PostgreSQL credentials come from .env (never committed). Variables: docs/operations/CONFIGURATION.md.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tga
      POSTGRES_DB: tga
      # Empty value makes the container refuse to start: set it in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tga -d tga"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: ., target: api }
    ports: ["127.0.0.1:3001:3001"]
    environment:
      APP_ENV: local
      LOG_LEVEL: info
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    ports: ["127.0.0.1:3000:3000"]
    read_only: true
    tmpfs: ["/app/apps/web/.next/cache"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  pgdata:
