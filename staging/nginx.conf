# Staging reverse proxy (PHASE-11B). The only published entry point; TLS terminates in front
# of it (Cloudflare or the host), see docs/operations/STAGING.md.
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
                              '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                              '"duration":$request_time,"upstream":"$upstream_addr"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;

  client_max_body_size 64k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  keepalive_timeout 30s;
  proxy_connect_timeout 5s;
  proxy_read_timeout 15s;
  proxy_send_timeout 15s;

  # Basic abuse control until API keys/quotas exist (PHASE-23). Provisional (OD-005).
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=pages:10m rate=20r/s;
  limit_req_status 429;

  # Re-resolve container names through Docker DNS (nginx >= 1.27.3 `resolve`): a recreated
  # container gets a new IP, and a startup-time lookup would keep routing to the old one
  # (found in PHASE-14: web traffic was sent to the api container's recycled address).
  resolver 127.0.0.11 valid=10s ipv6=off;
  upstream api { zone upstream_api 64k; server api:3001 resolve; keepalive 16; }
  upstream web { zone upstream_web 64k; server web:3000 resolve; keepalive 16; }

  server {
    listen 8080;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Staging must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;

    location = /robots.txt { add_header Content-Type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://api;
    }

    location = /health/live { proxy_pass http://api; }

    location / {
      limit_req zone=pages burst=40 nodelay;
      proxy_pass http://web;
    }
  }
}
